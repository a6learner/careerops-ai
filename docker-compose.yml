services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careerops
      POSTGRES_USER: careerops
      POSTGRES_PASSWORD: careerops
    ports:
      - "${CAREEROPS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerops -d careerops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${CAREEROPS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      CAREEROPS_ENV: ${CAREEROPS_ENV:-local}
      CAREEROPS_DATABASE_URL: postgresql+asyncpg://careerops:careerops@postgres:5432/careerops
      CAREEROPS_JWT_SECRET: ${CAREEROPS_JWT_SECRET:-change-me-in-local-development-secret-32-bytes-minimum}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "${CAREEROPS_API_PORT:-8000}:8000"
    environment:
      CAREEROPS_ENV: ${CAREEROPS_ENV:-local}
      CAREEROPS_DATABASE_URL: postgresql+asyncpg://careerops:careerops@postgres:5432/careerops
      CAREEROPS_REDIS_URL: redis://redis:6379/0
      CAREEROPS_JWT_SECRET: ${CAREEROPS_JWT_SECRET:-change-me-in-local-development-secret-32-bytes-minimum}
      CAREEROPS_LLM_PROVIDER: ${CAREEROPS_LLM_PROVIDER:-fake}
      CAREEROPS_EMBEDDING_PROVIDER: ${CAREEROPS_EMBEDDING_PROVIDER:-fake}
      CAREEROPS_EVIDENCE_MATCHER_PROVIDER: ${CAREEROPS_EVIDENCE_MATCHER_PROVIDER:-fake}
      CAREEROPS_LOG_LEVEL: ${CAREEROPS_LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      target: worker
    command: ["dramatiq", "careerops.workers.tasks", "--processes", "1", "--threads", "4"]
    healthcheck:
      disable: true
    environment:
      CAREEROPS_ENV: ${CAREEROPS_ENV:-local}
      CAREEROPS_DATABASE_URL: postgresql+asyncpg://careerops:careerops@postgres:5432/careerops
      CAREEROPS_REDIS_URL: redis://redis:6379/0
      CAREEROPS_JWT_SECRET: ${CAREEROPS_JWT_SECRET:-change-me-in-local-development-secret-32-bytes-minimum}
      CAREEROPS_LLM_PROVIDER: ${CAREEROPS_LLM_PROVIDER:-fake}
      CAREEROPS_LLM_MODEL: ${CAREEROPS_LLM_MODEL:-openai/gpt-oss-20b}
      CAREEROPS_LLM_BASE_URL: ${CAREEROPS_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      CAREEROPS_LLM_API_KEY: ${CAREEROPS_LLM_API_KEY:-}
      CAREEROPS_LLM_TIMEOUT_SECONDS: ${CAREEROPS_LLM_TIMEOUT_SECONDS:-30}
      CAREEROPS_LLM_MAX_ATTEMPTS: ${CAREEROPS_LLM_MAX_ATTEMPTS:-2}
      CAREEROPS_LLM_RETRY_BASE_DELAY_SECONDS: ${CAREEROPS_LLM_RETRY_BASE_DELAY_SECONDS:-0.25}
      CAREEROPS_LLM_MAX_OUTPUT_TOKENS: ${CAREEROPS_LLM_MAX_OUTPUT_TOKENS:-1500}
      CAREEROPS_EMBEDDING_PROVIDER: ${CAREEROPS_EMBEDDING_PROVIDER:-fake}
      CAREEROPS_GEMINI_API_KEY: ${CAREEROPS_GEMINI_API_KEY:-}
      CAREEROPS_EVIDENCE_MATCHER_PROVIDER: ${CAREEROPS_EVIDENCE_MATCHER_PROVIDER:-fake}
      CAREEROPS_LOG_LEVEL: ${CAREEROPS_LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${CAREEROPS_FRONTEND_PORT:-3000}:3000"
    environment:
      CAREEROPS_API_BASE_URL: http://api:8000
      CAREEROPS_FRONTEND_ORIGIN: http://127.0.0.1:${CAREEROPS_FRONTEND_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
