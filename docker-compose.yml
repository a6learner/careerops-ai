services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careerops
      POSTGRES_USER: careerops
      POSTGRES_PASSWORD: careerops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerops -d careerops"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["dramatiq", "careerops.workers.tasks", "--processes", "1", "--threads", "4"]
    environment:
      CAREEROPS_DATABASE_URL: postgresql+asyncpg://careerops:careerops@postgres:5432/careerops
      CAREEROPS_REDIS_URL: redis://redis:6379/0
      CAREEROPS_LLM_PROVIDER: ${CAREEROPS_LLM_PROVIDER:-fake}
      CAREEROPS_LLM_MODEL: ${CAREEROPS_LLM_MODEL:-openai/gpt-oss-20b}
      CAREEROPS_LLM_BASE_URL: ${CAREEROPS_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      CAREEROPS_LLM_API_KEY: ${CAREEROPS_LLM_API_KEY:-}
      CAREEROPS_LLM_TIMEOUT_SECONDS: ${CAREEROPS_LLM_TIMEOUT_SECONDS:-30}
      CAREEROPS_LLM_MAX_ATTEMPTS: ${CAREEROPS_LLM_MAX_ATTEMPTS:-2}
      CAREEROPS_LLM_RETRY_BASE_DELAY_SECONDS: ${CAREEROPS_LLM_RETRY_BASE_DELAY_SECONDS:-0.25}
      CAREEROPS_LLM_MAX_OUTPUT_TOKENS: ${CAREEROPS_LLM_MAX_OUTPUT_TOKENS:-1500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
