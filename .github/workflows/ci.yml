name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev,worker]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Import boundaries
        run: lint-imports

      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build deployment image
        run: docker build --tag careerops-ai-ci .
