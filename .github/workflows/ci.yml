name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev,worker]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Import boundaries
        run: lint-imports

      - name: Test
        run: pytest
